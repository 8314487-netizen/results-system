<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Results Management</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="text-center mb-4">Results Management System</h1>

    <div class="card p-3 mb-3">
      <input type="text" id="studentName" class="form-control mb-2" placeholder="Student name">
      <input type="number" id="grade1" class="form-control mb-2" placeholder="Subject 1 grade">
      <input type="number" id="grade2" class="form-control mb-2" placeholder="Subject 2 grade">
      <input type="number" id="grade3" class="form-control mb-2" placeholder="Subject 3 grade">
      <input type="number" id="attendance" class="form-control mb-3" placeholder="Attendance percentage">

      <div class="d-flex gap-2">
        <button id="addBtn" class="btn btn-primary">Add Student</button>
        <button id="mercyBtn" class="btn btn-warning">Activate Mercy Committee</button>
      </div>
    </div>

    <div id="errorBox" class="text-danger fw-bold mb-3"></div>
    <div id="studentsBox" class="mb-3"></div>
    <div id="reportBox"></div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
